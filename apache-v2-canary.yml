apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-canary
spec:
  replicas: 1   # only 1 pod for testing
  selector:
    matchLabels:
      app: apache
      version: v2
  template:
    metadata:
      labels:
        app: apache
        version: v2
    spec:
      containers:
      - name: apache
        image: apache-app:v2
        ports:
        - containerPort: 80
