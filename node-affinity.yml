apiVersion: v1
kind: Pod
metadata:
  name: apache-affinity
spec:
  containers:
  - name: apache
    image: nginx
    ports:
    - containerPort: 80

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: env
            operator: In
            values:
            - dev
